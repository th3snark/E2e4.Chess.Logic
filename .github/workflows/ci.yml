name: CI

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Directory.Packages.props
      - name: Check formatting
        if: runner.os == 'Windows'
        run: dotnet format whitespace E2e4.Chess.Logic.slnx --verify-no-changes
      - name: Test
        run: dotnet test E2e4.Chess.Logic.slnx --configuration Release
      - name: Pack
        run: dotnet pack src/E2e4.Chess.Logic/E2e4.Chess.Logic.csproj --configuration Release --no-build --output artifacts
      - name: No package dependencies (and so no GPL) in the package
        if: runner.os == 'Linux'
        run: |
          if unzip -p artifacts/E2e4.Chess.Logic.*.nupkg E2e4.Chess.Logic.nuspec | grep '<dependency '; then
            echo "The library must have no package dependencies."
            exit 1
          fi
